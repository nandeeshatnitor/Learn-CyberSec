[project]
name = "cve-learning-explorer-backend"
version = "0.1.0"
description = "API for CVE Learning Explorer, a cybersecurity education platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5.0,<7",
    "structlog>=24.1",
    "httpx2>=2,<3",
    "beautifulsoup4>=4.12,<5",
    "anthropic>=1,<2",
    "rq>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the local ./alembic migrations directory

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Pattern tables read better one entry per line than wrapped.
"app/research/injection.py" = ["E501"]
"app/research/facets.py" = ["E501"]
"app/research/classify.py" = ["E501"]
# Prompt/hint wording tables and word lists.
"app/learning/*.py" = ["E501", "SIM905"]
# User-facing message strings and shell/argv tables.
"app/sandbox/*.py" = ["E501"]
"app/api/routes/sandbox.py" = ["E501"]
"tests/sandbox/**" = ["E501", "S101", "S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true
